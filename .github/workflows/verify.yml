name: Verify Windows game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and verify LLVM MinGW
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $toolchain = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-x86_64.zip' -OutFile $archive
          $expected = 'e3ad77d117a4bea19a7a3b333341824d79a5a371004a10e25b8504e7b3047666'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'LLVM MinGW download checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolchain
          "HIPPOS_COMPILER=$toolchain/llvm-mingw-20260922-ucrt-x86_64/bin/clang.exe" >> $env:GITHUB_ENV
      - name: Build and run simulation and native window tests
        run: ./build.ps1 -Compiler $env:HIPPOS_COMPILER
